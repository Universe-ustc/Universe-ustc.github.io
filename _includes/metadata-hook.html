<!-- Custom fonts, styles, and ambiance -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap"
  rel="stylesheet"
>
<link id="custom-css" rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<script>
  (function () {
    function ensureCustomCssLast() {
      var original = document.getElementById('custom-css');
      if (!original || document.querySelector('link[data-custom-css-late="1"]')) return;
      var link = original.cloneNode(true);
      link.removeAttribute('id');
      link.setAttribute('data-custom-css-late', '1');
      document.head.appendChild(link);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ensureCustomCssLast);
    } else {
      ensureCustomCssLast();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          reg.unregister();
        });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          caches.delete(key);
        });
      });
    }

    function mountAmbiance() {
      if (document.querySelector('.site-ambiance')) return;
      var host = document.querySelector('#core-wrapper') || document.querySelector('#main-wrapper');
      if (!host) return;
      var wrap = document.createElement('div');
      wrap.className = 'site-ambiance';
      wrap.setAttribute('aria-hidden', 'true');
      wrap.innerHTML =
        '<div class="site-aurora"></div>' +
        '<div class="site-meteors">' +
        '<span class="meteor meteor--1"></span>' +
        '<span class="meteor meteor--2"></span>' +
        '<span class="meteor meteor--3"></span>' +
        '<span class="meteor meteor--4"></span>' +
        '</div>';
      host.insertBefore(wrap, host.firstChild);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mountAmbiance);
    } else {
      mountAmbiance();
    }
  })();
</script>
